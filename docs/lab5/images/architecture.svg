<rect x="745" y="335" width="350" height="235" rx="12" fill="#eff6ff" stroke="#93b8ee" stroke-width="2"/>
<text x="765" y="360" font-size="15" fill="#172b45" font-weight="700">public-b · 10.28.1.0/24 · eu-central-1b</text>
<rect x="345" y="645" width="350" height="205" rx="12" fill="#f0fdf4" stroke="#86cda1" stroke-width="2"/>
<text x="365" y="672" font-size="14" fill="#172b45" font-weight="700">private-a · 10.28.10.0/24 · eu-central-1a</text>
<rect x="745" y="645" width="350" height="205" rx="12" fill="#f0fdf4" stroke="#86cda1" stroke-width="2" stroke-dasharray="7 5"/>
<text x="765" y="672" font-size="16" fill="#172b45" font-weight="700">private-b · 10.28.11.0/24</text>
<text x="770" y="720" font-size="16" fill="#172b45">eu-central-1b · входит в DB subnet group</text>
<text x="770" y="751" font-size="15" fill="#172b45">Standby и read replica не созданы</text>
<text x="770" y="785" font-size="15" fill="#172b45">private-rt: только local-маршрут</text>
<rect x="370" y="380" width="300" height="170" rx="12" fill="#fff" stroke="#e6a546" stroke-width="2"/>
<text x="390" y="407" font-size="20" fill="#172b45" font-weight="700">timecapsule-dev-app</text>
<text x="390" y="435" font-size="16" fill="#172b45">Private IP: 10.28.0.142</text>
<text x="390" y="459" font-size="16" fill="#172b45">Elastic IP: 18.159.49.8</text>
<text x="390" y="483" font-size="16" fill="#172b45">Nginx + PHP-FPM + AWS SDK</text>
<text x="390" y="507" font-size="14" fill="#172b45">web-sg: HTTP 80; SSH от bastion</text>
<text x="390" y="532" font-size="14" fill="#c46b00" font-weight="700">Вложения: S3 · сессии: local</text>
