<text x="700" y="450" font-size="13" fill="#64748b">SSH</text>
<path d="M245 690H290V580H1110V460H1070" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#gray)" stroke-dasharray="7 5"/>
<text x="60" y="769" font-size="14" fill="#64748b">SSH 22: My IP → bastion</text>

<path d="M1190 870H1147V929H705V535H670" fill="none" stroke="#7652b1" stroke-width="2.5" marker-end="url(#purple)" stroke-dasharray="7 5"/>
<text x="760" y="951" font-size="15" fill="#7652b1">Instance profile: роль привязана к app-server (логическая связь)</text>
<text x="315" y="980" font-size="14" fill="#172b45">Route 53 private zone: db.timecapsule.internal → CNAME (TTL 60) → endpoint timecapsule-dev-rds.*.rds.amazonaws.com</text>
<rect x="1190" y="125" width="350" height="110" rx="12" fill="#f5f0ff" stroke="#a38bd0" stroke-width="2"/>
<text x="1205" y="150" font-size="18" fill="#7652b1" font-weight="700">EventBridge Scheduler · eu-central-1</text>
<text x="1205" y="175" font-size="14">nightly-stop · 23:00 Europe/Chisinau</text>
<text x="1205" y="198" font-size="14">Execution role: scheduler-role</text>
<text x="1205" y="221" font-size="14">StopDBInstance → только timecapsule-dev-rds</text>
<path d="M1190 200H1175V920H330V815H365" fill="none" stroke="#7652b1" stroke-width="2" marker-end="url(#purple)" stroke-dasharray="7 5"/>
<text x="365" y="871" font-size="13" fill="#16804a">DB subnet group: timecapsule-dev-db-subnets (private-a + private-b)</text>
<text x="30" y="1020" font-size="16" fill="#64748b">Историческая схема после миграции: EC2 db-server удалён. PHP-сессии локальные; ALB и Multi-AZ не развёрнуты.</text>
</g></svg>
