<text x="790" y="407" font-size="19" fill="#172b45" font-weight="700">timecapsule-dev-bastion</text>
<text x="790" y="435" font-size="16" fill="#172b45">SSH / ProxyJump</text>
<text x="790" y="461" font-size="14" fill="#172b45">Публичный IP меняется при запуске</text>
<text x="790" y="489" font-size="15" fill="#172b45">bastion-sg: SSH 22 с My IP</text>
<text x="790" y="517" font-size="13" fill="#172b45">SSH только к app-server; у RDS SSH нет</text>
<rect x="365" y="690" width="310" height="140" rx="12" fill="#fff" stroke="#4ca879" stroke-width="2"/>
<text x="385" y="718" font-size="19" fill="#172b45" font-weight="700">timecapsule-dev-rds</text>
<text x="385" y="744" font-size="15" fill="#172b45">PostgreSQL 16.15 · db.t4g.micro</text>
<text x="385" y="771" font-size="14" fill="#172b45">Single-AZ · gp3 20 GiB · backup 7d</text>
<text x="385" y="796" font-size="14" fill="#172b45">rds-sg: 5432 только от web-sg</text>
<text x="385" y="818" font-size="13" fill="#172b45">Private · encrypted · deletion protection</text>
<text x="340" y="886" font-size="14" fill="#172b45">public-rt: 0.0.0.0/0 → IGW · private-rt: только local · NAT Gateway отсутствует</text>
<rect x="535" y="190" width="280" height="48" rx="12" fill="#e8f6ee" stroke="#67a983" stroke-width="2"/>
<text x="675" y="219" font-size="18" fill="#172b45" font-weight="700" text-anchor="middle">Internet Gateway</text>
<rect x="25" y="125" width="220" height="95" rx="12" fill="#eff6ff" stroke="#93b8ee" stroke-width="2"/>
<text x="45" y="157" font-size="17" fill="#172b45" font-weight="700">Браузер пользователя</text>
<text x="45" y="186" font-size="15" fill="#172b45">Интерфейс и скачивание</text>
<rect x="25" y="640" width="220" height="100" rx="12" fill="#fff7e8" stroke="#dba657" stroke-width="2"/>
<text x="45" y="675" font-size="19" fill="#172b45" font-weight="700">Администратор</text>
<text x="45" y="706" font-size="16" fill="#172b45">SSH через bastion</text>
<rect x="1190" y="320" width="350" height="340" rx="12" fill="#f0fdf4" stroke="#4ca879" stroke-width="2"/>
<text x="1210" y="353" font-size="22" fill="#16804a" font-weight="700">Amazon S3 · вне VPC</text>
<text x="1210" y="383" font-size="16" fill="#172b45" font-weight="700">timecapsule-dev-uploads-hakonn5</text>
<text x="1210" y="412" font-size="16" fill="#172b45">Ключи вложений: uploads/&lt;имя&gt;</text>
<text x="1210" y="445" font-size="15" fill="#172b45">Block Public Access · ACL disabled</text>
<text x="1210" y="473" font-size="15" fill="#172b45">SSE-S3 · Versioning · HTTPS only</text>
<text x="1210" y="510" font-size="13" fill="#172b45">Старые версии: Standard-IA ≥30 дн.; ограничения</text>
<text x="1210" y="538" font-size="15" fill="#172b45">Удаление: ≥90 дн., сохранить 2</text>
<text x="1210" y="566" font-size="15" fill="#172b45">Незавершённые multipart: 7 дней</text>
<text x="1210" y="605" font-size="16" fill="#172b45" font-weight="700">Браузер читает файл напрямую.</text>
<text x="1210" y="633" font-size="15" fill="#172b45">Приложение не передаёт его байты.</text>
<rect x="1190" y="735" width="350" height="175" rx="12" fill="#f5f0ff" stroke="#a38bd0" stroke-width="2"/>
<text x="1210" y="766" font-size="21" fill="#7652b1" font-weight="700">IAM (global) · роль EC2</text>
<text x="1210" y="797" font-size="17" fill="#172b45" font-weight="700">timecapsule-dev-app-role</text>
<text x="1210" y="827" font-size="15" fill="#172b45">GetObject / PutObject / DeleteObject</text>
<text x="1210" y="853" font-size="15" fill="#172b45">Только uploads/* · без ListBucket</text>
<text x="1210" y="882" font-size="15" fill="#172b45">Временные credentials через IMDS</text>
