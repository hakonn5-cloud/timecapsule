<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc">
<title id="title">TimeCapsule — PostgreSQL в Amazon RDS и вложения в S3</title>
<desc id="desc">Браузер обращается к app-server через Internet Gateway. Приложение записывает и удаляет объекты S3 с ролью EC2 и выдаёт подписанный URL. Браузер получает файл напрямую из S3. RDS Single-AZ находится в приватной подсети, DNS указывает на endpoint через CNAME. Scheduler останавливает базу в 23:00. SSH через bastion используется только для app-server.</desc>
<defs>
